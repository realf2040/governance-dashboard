<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Governance Dashboard | لوحة الحوكمة</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,Tahoma,sans-serif;background:#fff}.bar{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 4%;border-bottom:4px solid #4B1F6F;background:#fff}.brand{font-weight:700;color:#123B5D}.switch{display:flex;gap:8px}.switch button{border:1px solid #4B1F6F;background:#fff;color:#4B1F6F;padding:9px 16px;border-radius:8px;cursor:pointer;font-weight:700}.switch button.active{background:#4B1F6F;color:#fff}iframe{width:100%;height:calc(100vh - 64px);border:0;display:block}</style></head><body><div class="bar"><div class="brand" id="brand">لوحة حوكمة عمليات قطاع الأعمال</div><div class="switch"><button id="ar" class="active" onclick="setLang('ar')">العربية</button><button id="en" onclick="setLang('en')">English</button></div></div><iframe id="app" src="ar.html" title="Governance Dashboard"></iframe><script>const app=document.getElementById('app');app.addEventListener('load',()=>{const d=app.contentDocument;if(!d||d.getElementById('gov-data-tools'))return;const s=d.createElement('script');s.id='gov-data-tools';s.src='app.js';d.body.appendChild(s)});function setLang(l){document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';app.src=l==='ar'?'ar.html':'en.html';document.getElementById('brand').textContent=l==='ar'?'لوحة حوكمة عمليات قطاع الأعمال':'Business Sector Governance Operations Dashboard';document.getElementById('ar').classList.toggle('active',l==='ar');document.getElementById('en').classList.toggle('active',l==='en');localStorage.setItem('govLang',l)}setLang(localStorage.getItem('govLang')||'ar')</script></body></html>
