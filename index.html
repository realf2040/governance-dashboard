<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Governance Dashboard | لوحة الحوكمة</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,Tahoma,sans-serif;background:#fff}.bar{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 4%;border-bottom:4px solid #4B1F6F;background:#fff}.brand{font-weight:700;color:#123B5D}.switch{display:flex;gap:8px}.switch button,.login button{border:1px solid #4B1F6F;background:#fff;color:#4B1F6F;padding:9px 16px;border-radius:8px;cursor:pointer;font-weight:700}.switch button.active,.login button{background:#4B1F6F;color:#fff}iframe{width:100%;height:calc(100vh - 64px);border:0;display:block}.login-screen{position:fixed;inset:0;z-index:9999;background:#fff;display:flex;align-items:center;justify-content:center;padding:24px}.login{width:min(430px,100%);border:1px solid #d8dce3;border-top:5px solid #4B1F6F;border-radius:16px;padding:30px;box-shadow:0 12px 40px #00000012;text-align:center}.login h1{margin:0 0 8px;color:#4B1F6F;font-size:27px}.login p{color:#123B5D;margin:0 0 24px}.login label{display:block;text-align:start;color:#123B5D;font-weight:700;margin:12px 0 6px}.login input{width:100%;padding:12px;border:1px solid #cfd6df;border-radius:9px;font:inherit}.login button{width:100%;margin-top:20px;padding:12px}.login-error{min-height:22px;color:#C62828;font-weight:700;margin-top:12px}.hidden{display:none!important}</style></head><body><div id="login-screen" class="login-screen"><form id="login-form" class="login"><h1 id="login-title">تسجيل الدخول</h1><p id="login-sub">لوحة حوكمة عمليات قطاع الأعمال</p><label id="user-label" for="username">اسم المستخدم</label><input id="username" autocomplete="username" required><label id="pass-label" for="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required><button id="login-btn" type="submit">دخول</button><div id="login-error" class="login-error"></div></form></div><div id="dashboard" class="hidden"><div class="bar"><div class="brand" id="brand">لوحة حوكمة عمليات قطاع الأعمال</div><div class="switch"><button id="ar" class="active" onclick="setLang('ar')">العربية</button><button id="en" onclick="setLang('en')">English</button></div></div><iframe id="app" src="ar.html" title="Governance Dashboard"></iframe></div><script>const screen=document.getElementById('login-screen'),dashboard=document.getElementById('dashboard'),form=document.getElementById('login-form'),app=document.getElementById('app');function unlock(){screen.classList.add('hidden');dashboard.classList.remove('hidden')}if(sessionStorage.getItem('govAuthenticated')==='1')unlock();form.addEventListener('submit',e=>{e.preventDefault();const u=document.getElementById('username').value,p=document.getElementById('password').value;if(u==='Admin'&&p==='Admin'){sessionStorage.setItem('govAuthenticated','1');document.getElementById('login-error').textContent='';unlock()}else document.getElementById('login-error').textContent=document.documentElement.lang==='ar'?'اسم المستخدم أو كلمة المرور غير صحيحة':'Incorrect username or password'});app.addEventListener('load',()=>{try{const d=app.contentDocument;if(!d||d.getElementById('gov-enhancements'))return;const s=d.createElement('script');s.id='gov-enhancements';s.src='enhancements.js';d.body.appendChild(s)}catch(e){}});function setLang(l){document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';app.src=l==='ar'?'ar.html':'en.html';document.getElementById('brand').textContent=l==='ar'?'لوحة حوكمة عمليات قطاع الأعمال':'Business Sector Governance Operations Dashboard';document.getElementById('ar').classList.toggle('active',l==='ar');document.getElementById('en').classList.toggle('active',l==='en');localStorage.setItem('govLang',l)}setLang(localStorage.getItem('govLang')||'ar')</script></body></html>
